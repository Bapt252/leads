<script type="module">
// ============================================================================
// Configuration
// ============================================================================

// URL du Worker Cloudflare (pas un secret, juste une URL).
const WORKER_URL = 'https://leads-france-travail.baptiste-coma.workers.dev';

// Le store n'est plus un fichier statique : il vit dans Cloudflare KV et est
// servi par le Worker. GET /leads est public (pas d'auth).
const LEADS_URL = `${WORKER_URL}/leads`;

// Clé API du Worker — option automatique, VISIBLE PUBLIQUEMENT dans le source.
// Si tu colles ta SHARED_API_KEY ici, plus aucun prompt ne sera affiché ;
// en contrepartie, n'importe qui qui lit le source peut appeler ton Worker.
// Accepté pour un outil perso à faible trafic. Laisse '' pour exiger un prompt
// unique stocké dans localStorage (plus sûr).
const HARDCODED_API_KEY = '';

// Clé de stockage localStorage pour l'API key du Worker (fallback si pas hardcodée).
const API_KEY_STORAGE = 'leads.worker_api_key';

// ============================================================================
// État global
// ============================================================================

let store = null;           // { version, updated_at, jobs: [], accounts: [], tombstones: [] }
let currentFilters = {};    // { status, departement, sector, rome_label }

// IDs d'offres en cours de suppression (toast Annuler 5s en cours).
// On les masque visuellement mais on ne les supprime pas tant que le timer
// n'a pas expiré : permet l'annulation sans aller-retour serveur.
const pendingDeletions = new Map(); // id -> { job, timer, toastEl }

// Sélection multiple (checkbox).
const selectedJobIds = new Set();
let lastClickedJobId = null;        // pour Shift+click

// Lignes Prospectés dépliées (account_id).
const expandedAccounts = new Set();

// ID de la ligne actuellement focus clavier (j/k navigation).
let focusedJobId = null;

// Cache des jobs visibles dans l'ordre courant — recomputé à chaque render
// pour que j/k naviguent correctement après un filtre/tri.
let visibleJobsCache = [];

// Contact en cours d'édition dans le panneau d'un compte. `contactId` à null
// signifie "ajout d'un nouveau contact". null = pas de formulaire ouvert.
let editingContact = null; // { accountId, contactId } | null

// Étapes du pipeline + couleurs Tailwind. Ordre = ordre d'affichage des chips.
const STAGE_ORDER = ['nouveau', 'contacte', 'relance', 'rdv', 'qualifie', 'gagne', 'perdu'];
const STAGE_CONFIG = {
  nouveau:   { label: 'Nouveau',   cls: 'bg-zinc-100 text-zinc-700 ring-zinc-200',       dot: 'bg-zinc-400' },
  contacte:  { label: 'Contacté',  cls: 'bg-blue-50 text-blue-700 ring-blue-200',         dot: 'bg-blue-500' },
  relance:   { label: 'Relancé',   cls: 'bg-amber-50 text-amber-700 ring-amber-200',      dot: 'bg-amber-500' },
  rdv:       { label: 'RDV',       cls: 'bg-violet-50 text-violet-700 ring-violet-200',   dot: 'bg-violet-500' },
  qualifie:  { label: 'Qualifié',  cls: 'bg-indigo-50 text-indigo-700 ring-indigo-200',   dot: 'bg-indigo-500' },
  gagne:     { label: 'Gagné',     cls: 'bg-emerald-50 text-emerald-700 ring-emerald-200', dot: 'bg-emerald-500' },
  perdu:     { label: 'Perdu',     cls: 'bg-red-50 text-red-700 ring-red-200',             dot: 'bg-red-500' },
};

// ============================================================================
// Helpers réseau
// ============================================================================

function getApiKey() {
  // Priorité à la clé hardcodée, fallback sur localStorage.
  if (HARDCODED_API_KEY) return HARDCODED_API_KEY;
  return localStorage.getItem(API_KEY_STORAGE);
}

function setApiKey(key) {
  localStorage.setItem(API_KEY_STORAGE, key);
}

function clearApiKey() {
  localStorage.removeItem(API_KEY_STORAGE);
}

function ensureApiKey() {
  const existing = getApiKey();
  if (existing) return existing;
  const entered = window.prompt(
    'Clé API du Worker Cloudflare (une seule fois, stockée localement) :',
  );
  if (!entered) return null;
  const trimmed = entered.trim();
  setApiKey(trimmed);
  return trimmed;
}

async function loadStore() {
  // ?t=<timestamp> pour contourner le cache navigateur après une écriture.
  const res = await fetch(`${LEADS_URL}?t=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`GET /leads a échoué : ${res.status}`);
  return await res.json();
}

async function workerFetch(path, init = {}) {
  const key = ensureApiKey();
  if (!key) throw new Error('Clé API absente');
  const res = await fetch(`${WORKER_URL}${path}`, {
    ...init,
    headers: {
      ...(init.headers ?? {}),
      'Content-Type': 'application/json',
      'X-API-Key': key,
    },
  });
  if (res.status === 401) {
    clearApiKey();
    throw new Error('Clé API refusée — retente pour la saisir à nouveau');
  }
  if (!res.ok) {
    throw new Error(`Worker a répondu ${res.status} : ${await res.text()}`);
  }
  return res;
}

// Toutes les mutations renvoient le store complet à jour. On l'utilise pour
// rafraîchir l'UI sans refetch (KV peut servir une lecture stale juste après
// une écriture).
async function patchLead(id, patch) {
  const res = await workerFetch(`/leads/${encodeURIComponent(id)}`, {
    method: 'PATCH',
    body: JSON.stringify(patch),
  });
  const data = await res.json();
  return data.store;
}

async function deleteLead(id) {
  const res = await workerFetch(`/leads/${encodeURIComponent(id)}`, {
    method: 'DELETE',
  });
  const data = await res.json();
  return data.store;
}

async function markAllProspectedIds(ids) {
  if (ids.length === 0) return null;
  const res = await workerFetch('/leads/mark-all-prospected', {
    method: 'POST',
    body: JSON.stringify({ ids }),
  });
  const data = await res.json();
  return data.store;
}

async function patchAccount(accountId, patch) {
  const res = await workerFetch(`/accounts/${encodeURIComponent(accountId)}`, {
    method: 'PATCH',
    body: JSON.stringify(patch),
  });
  const data = await res.json();
  return data.store;
}

async function addContact(accountId, contact) {
  const res = await workerFetch(`/accounts/${encodeURIComponent(accountId)}/contacts`, {
    method: 'POST',
    body: JSON.stringify(contact),
  });
  const data = await res.json();
  return data.store;
}

async function updateContact(accountId, contactId, patch) {
  const res = await workerFetch(
    `/accounts/${encodeURIComponent(accountId)}/contacts/${encodeURIComponent(contactId)}`,
    { method: 'PATCH', body: JSON.stringify(patch) },
  );
  const data = await res.json();
  return data.store;
}

async function deleteContact(accountId, contactId) {
  const res = await workerFetch(
    `/accounts/${encodeURIComponent(accountId)}/contacts/${encodeURIComponent(contactId)}`,
    { method: 'DELETE' },
  );
  const data = await res.json();
  return data.store;
}

// Remplace le store local et redessine. Utilisé après chaque mutation.
function applyNewStore(newStore) {
  if (!newStore) return;
  store = newStore;
  render();
}

async function triggerIngest() {
  await workerFetch('/ingest/france-travail', { method: 'POST' });
}

// ============================================================================
// URL state
// ============================================================================

function readFiltersFromUrl() {
  const p = new URLSearchParams(window.location.search);
  const status = p.get('status');
  return {
    status: status === 'prospected' || status === 'all' ? status : 'new',
    departement: p.get('departement') || undefined,
    sector: p.get('sector') || undefined,
    rome_label: p.get('rome_label') || undefined,
  };
}

function writeFiltersToUrl(filters) {
  const p = new URLSearchParams();
  if (filters.status && filters.status !== 'new') p.set('status', filters.status);
  if (filters.departement) p.set('departement', filters.departement);
  if (filters.sector) p.set('sector', filters.sector);
  if (filters.rome_label) p.set('rome_label', filters.rome_label);
  const qs = p.toString();
  const url = qs ? `?${qs}` : window.location.pathname;
  window.history.pushState({}, '', url);
}

function updateFilter(key, value) {
  currentFilters = { ...currentFilters, [key]: value || undefined };
  writeFiltersToUrl(currentFilters);
  // On vide la sélection multi à chaque changement de filtre/onglet, sinon
  // l'utilisateur garde des sélections invisibles qu'il ne maîtrise plus.
  selectedJobIds.clear();
  lastClickedJobId = null;
  render();
}

// ============================================================================
// Données (filtre + stats)
// ============================================================================

function filterJobs(jobs, q) {
  return jobs
    .filter((j) => {
      if (q.status !== 'all' && j.status !== q.status) return false;
      if (q.departement && j.departement !== q.departement) return false;
      if (q.sector && j.sector !== q.sector) return false;
      if (q.rome_label && j.rome_label !== q.rome_label) return false;
      return true;
    })
    .sort((a, b) => {
      const ka = a.posted_at ?? a.created_at;
      const kb = b.posted_at ?? b.created_at;
      return kb.localeCompare(ka);
    });
}

function distinctValues(jobs, column) {
  const set = new Set();
  for (const j of jobs) {
    const v = j[column];
    if (v) set.add(v);
  }
  return Array.from(set).sort();
}

// ============================================================================
// CSV export
// ============================================================================

const CSV_HEADERS = [
  'id','source','source_url','company_name','job_title','location',
  'departement','sector','rome_label','posted_at','status','prospected_at',
  'contact_name','contact_email','contact_phone','notes','created_at',
];

function escapeCell(v) {
  if (v === null || v === undefined) return '';
  const s = String(v);
  if (/[",\n\r]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}

function jobsToCsv(jobs) {
  const lines = [CSV_HEADERS.join(',')];
  for (const j of jobs) {
    lines.push(CSV_HEADERS.map((h) => escapeCell(j[h])).join(','));
  }
  return lines.join('\n');
}

function downloadCsv() {
  const jobs = filterJobs(store.jobs, currentFilters);
  const csv = jobsToCsv(jobs);
  const today = new Date().toISOString().slice(0, 10);
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `leads-${currentFilters.status}-${today}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

// ============================================================================
// Rendu DOM (helpers pour éviter XSS)
// ============================================================================

function el(tag, props = {}, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on')) node.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== null && v !== undefined && v !== false) node.setAttribute(k, v);
  }
  for (const c of children.flat()) {
    if (c === null || c === undefined || c === false) continue;
    node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
  }
  return node;
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// ============================================================================
// Toast
// ============================================================================

function showToast(msg, kind = 'info') {
  const container = document.getElementById('toast-container');
  container.innerHTML = '';
  const style = kind === 'error'
    ? 'border-red-200 bg-red-50 text-red-800'
    : 'border-blue-200 bg-blue-50 text-blue-800';
  const toast = el('div', { class: `mb-6 flex items-start justify-between gap-3 rounded-lg border px-4 py-3 text-sm ${style}` },
    el('span', {}, msg),
    el('button', {
      type: 'button',
      class: 'shrink-0 rounded-md px-2 py-0.5 text-xs font-medium opacity-70 transition hover:opacity-100',
      onClick: () => (container.innerHTML = ''),
    }, 'Fermer'),
  );
  container.appendChild(toast);
}

// Toast d'annulation avec barre de progression. onConfirm est appelé après
// le délai (sauf si l'utilisateur clique Annuler avant). Renvoie un objet
// avec une méthode dismiss() pour fermer le toast prématurément.
function showUndoToast(msg, onConfirm, onUndo, durationMs = 5000) {
  const container = document.getElementById('toast-container');
  const toast = el('div', {
    class: 'mb-6 overflow-hidden rounded-lg border border-amber-200 bg-amber-50 text-amber-900 shadow-sm',
  });
  const row = el('div', { class: 'flex items-center justify-between gap-3 px-4 py-3 text-sm' },
    el('span', {}, msg),
    el('div', { class: 'flex items-center gap-2' },
      el('button', {
        type: 'button',
        class: 'rounded-md border border-amber-300 bg-white px-3 py-1 text-xs font-medium text-amber-900 transition hover:bg-amber-100',
        onClick: () => {
          if (state.done) return;
          state.done = true;
          clearTimeout(state.timer);
          toast.remove();
          onUndo?.();
        },
      }, 'Annuler'),
    ),
  );
  const progress = el('div', {
    class: 'h-1 bg-amber-400/60',
    style: `width: 100%; transition: width ${durationMs}ms linear;`,
  });
  toast.appendChild(row);
  toast.appendChild(progress);
  container.appendChild(toast);
  // Force un reflow puis lance l'animation (sinon transition saute).
  void progress.offsetWidth;
  progress.style.width = '0%';

  const state = { done: false, timer: null };
  state.timer = setTimeout(() => {
    if (state.done) return;
    state.done = true;
    toast.remove();
    onConfirm?.();
  }, durationMs);

  return {
    dismiss() {
      if (state.done) return;
      state.done = true;
      clearTimeout(state.timer);
      toast.remove();
    },
  };
}

// ============================================================================
// Modal prospect
// ============================================================================

function openProspectDialog(job) {
  const dialog = document.getElementById('prospect-dialog');
  const form = document.getElementById('prospect-form');
  document.getElementById('prospect-title').textContent =
    job.status === 'prospected' ? 'Mettre à jour le contact' : 'Marquer prospecté';
  document.getElementById('prospect-subtitle').textContent = `${job.company_name} · ${job.job_title}`;
  form.contact_name.value = job.contact_name ?? '';
  form.contact_email.value = job.contact_email ?? '';
  form.contact_phone.value = job.contact_phone ?? '';
  form.notes.value = job.notes ?? '';
  form.dataset.jobId = job.id;
  dialog.showModal();
}

function emptyToNull(v) {
  if (typeof v !== 'string') return null;
  const t = v.trim();
  return t === '' ? null : t;
}

document.getElementById('prospect-cancel').addEventListener('click', () => {
  document.getElementById('prospect-dialog').close();
});

document.getElementById('prospect-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.currentTarget;
  const submit = document.getElementById('prospect-submit');
  if (submit.disabled) return;
  submit.disabled = true;
  submit.textContent = 'Enregistrement…';
  try {
    const id = form.dataset.jobId;
    const newStore = await patchLead(id, {
      status: 'prospected',
      contact_name: emptyToNull(form.contact_name.value),
      contact_email: emptyToNull(form.contact_email.value),
      contact_phone: emptyToNull(form.contact_phone.value),
      notes: emptyToNull(form.notes.value),
    });
    document.getElementById('prospect-dialog').close();
    applyNewStore(newStore);
  } catch (err) {
    window.alert(`Échec : ${err.message ?? err}`);
  } finally {
    submit.disabled = false;
    submit.textContent = 'Enregistrer';
  }
});

// ============================================================================
// Rendus partiels
// ============================================================================

function renderStats() {
  const container = document.getElementById('stats');
  container.innerHTML = '';
  const total = store.jobs.length;
  const news = store.jobs.filter((j) => j.status === 'new').length;
  const prosp = store.jobs.filter((j) => j.status === 'prospected').length;

  function card(label, value, accent) {
    const badge = { zinc: 'bg-zinc-900 text-white', blue: 'bg-blue-50 text-blue-700 ring-1 ring-blue-100', green: 'bg-emerald-50 text-emerald-700 ring-1 ring-emerald-100' }[accent];
    const tag = { zinc: 'total', blue: 'actif', green: 'traité' }[accent];
    return el('div', { class: 'rounded-2xl border border-zinc-200 bg-white p-5 shadow-sm' },
      el('p', { class: 'text-xs font-medium uppercase tracking-wider text-zinc-500' }, label),
      el('div', { class: 'mt-2 flex items-baseline gap-3' },
        el('span', { class: 'text-3xl font-semibold' }, value),
        el('span', { class: `rounded-full px-2 py-0.5 text-xs font-medium ${badge}` }, tag),
      ),
    );
  }
  container.appendChild(card('Total offres', total, 'zinc'));
  container.appendChild(card('À prospecter', news, 'blue'));
  container.appendChild(card('Prospectés', prosp, 'green'));
}

function renderTabs() {
  const nav = document.getElementById('tabs');
  nav.innerHTML = '';
  const tabs = [
    { label: 'À prospecter', value: 'new' },
    { label: 'Prospectés', value: 'prospected' },
    { label: 'Toutes', value: 'all' },

  for (const t of tabs) {

    const btn = el('button', {
      type: 'button',
      class: active
        ? 'rounded-md bg-white px-3 py-1.5 font-medium text-zinc-900 shadow-sm'
        : 'rounded-md px-3 py-1.5 text-zinc-600 transition hover:text-zinc-900',
      onClick: () => updateFilter('status', t.value),
    }, t.label);

function renderFilters() {
  const container = document.getElementById('filters');
  container.innerHTML = '';
  const departements = distinctValues(store.jobs, 'departement');
  const sectors = distinctValues(store.jobs, 'sector');
  const romeLabels = distinctValues(store.jobs, 'rome_label');

  function select(label, options, key) {
    const value = currentFilters[key] ?? '';
    const hasValue = value !== '';
    const sel = el('select', {
      'aria-label': label,
      class: `rounded-lg border px-3 py-1.5 text-sm transition focus:outline-none focus:ring-2 focus:ring-zinc-900/10 ${hasValue ? 'border-zinc-900 bg-zinc-900 text-white' : 'border-zinc-200 bg-white text-zinc-700 hover:border-zinc-300'}`,
      onChange: (e) => updateFilter(key, e.target.value),
    });
    sel.appendChild(el('option', { value: '' }, `Tous — ${label}`));
    for (const opt of options) {
      const o = el('option', { value: opt, class: 'bg-white text-zinc-700' }, opt);
      if (opt === value) o.selected = true;
      sel.appendChild(o);
    }
    return sel;
  }

  container.appendChild(select('Département', departements, 'departement'));
  container.appendChild(select('Secteur', sectors, 'sector'));
  container.appendChild(select('Métier', romeLabels, 'rome_label'));

  const hasAny = currentFilters.departement || currentFilters.sector || currentFilters.rome_label;
  if (hasAny) {
    container.appendChild(el('button', {
      type: 'button',
      class: 'ml-1 text-xs font-medium text-zinc-500 underline-offset-2 transition hover:text-zinc-900 hover:underline',
      onClick: () => {
        currentFilters = { status: currentFilters.status };
        writeFiltersToUrl(currentFilters);
        render();
      },
    }, 'Effacer'));
  }
}

// ============================================================================
// Suppression avec annulation 5s
// ============================================================================

function deleteWithUndo(job) {
  // Si déjà en cours de suppression sur ce job, on ne refait rien.
  if (pendingDeletions.has(job.id)) return;

  const handle = showUndoToast(
    `Offre supprimée : ${job.company_name} · ${job.job_title}`,
    async () => {
      // Délai écoulé : on supprime vraiment côté serveur.
      pendingDeletions.delete(job.id);
      try {
        const newStore = await deleteLead(job.id);
        applyNewStore(newStore);
      } catch (err) {
        showToast(`Échec suppression : ${err.message ?? err}`, 'error');
        render();
      }
    },
    () => {
      // Annulation : on retire le pending et on redessine.
      pendingDeletions.delete(job.id);
      render();
    },
  );

  pendingDeletions.set(job.id, { job, handle });
  // Si focus sur cette ligne, on bouge le focus vers la prochaine visible
  if (focusedJobId === job.id) {
    const idx = visibleJobsCache.findIndex((j) => j.id === job.id);
    const next = visibleJobsCache[idx + 1] ?? visibleJobsCache[idx - 1];
    focusedJobId = next?.id ?? null;
  }
  render();
}

// ============================================================================
// Renommage entreprise (factorisé : utilisé sur "Renseigner")
// ============================================================================

async function renameCompanyPrompt(job) {
  const initial = job.company_name === 'Non communiqué' ? '' : job.company_name;
  const entered = window.prompt('Nom de l\'entreprise :', initial);
  if (entered === null) return;
  const trimmed = entered.trim();
  if (trimmed === '' || trimmed === 'Non communiqué') return;
  try {
    const newStore = await patchLead(job.id, { company_name: trimmed });
    applyNewStore(newStore);
  } catch (err) {
    showToast(err.message ?? String(err), 'error');
  }
}

// ============================================================================
// Construction d'une ligne de job (réutilisée vue plate ET vue dépliée)
// ============================================================================

function buildJobRow(job, { showCheckbox = false, indented = false } = {}) {
  const isFocused = focusedJobId === job.id;
  const tr = el('tr', {
    class: `border-b border-zinc-50 transition hover:bg-zinc-50/50 cursor-pointer${
      isFocused ? ' bg-amber-50/40 ring-2 ring-inset ring-amber-300/60' : ''
    }${indented ? ' bg-zinc-50/40' : ''}`,
    'data-job-id': job.id,
  });
  tr.addEventListener('click', (e) => {
    if (e.target.closest('button, a, input, label')) return;
    focusedJobId = job.id;
    render();
  });

  if (showCheckbox) {
    const cb = el('input', {
      type: 'checkbox',
      class: 'h-4 w-4 cursor-pointer rounded border-zinc-300',
    });
    cb.checked = selectedJobIds.has(job.id);
    cb.addEventListener('click', (e) => {
      e.stopPropagation();
      const visIds = visibleJobsCache.map((j) => j.id);
      if (e.shiftKey && lastClickedJobId && lastClickedJobId !== job.id) {
        const a = visIds.indexOf(lastClickedJobId);
        const b = visIds.indexOf(job.id);
        if (a >= 0 && b >= 0) {
          const [s, e2] = [Math.min(a, b), Math.max(a, b)];
          const target = cb.checked;
          for (let i = s; i <= e2; i++) {
            if (target) selectedJobIds.add(visIds[i]);
            else selectedJobIds.delete(visIds[i]);
          }
        }
      } else {
        if (cb.checked) selectedJobIds.add(job.id);
        else selectedJobIds.delete(job.id);
      }
      lastClickedJobId = job.id;
      render();
    });
    tr.appendChild(el('td', { class: 'px-3 py-3 first:pl-6' }, cb));
  } else if (indented) {
    tr.appendChild(el('td', { class: 'px-3 py-3 first:pl-12' }));
  }

  // Date
  const dateClass = `whitespace-nowrap px-3 py-3 text-zinc-600${
    !showCheckbox && !indented ? ' first:pl-6' : ''
  }`;
  tr.appendChild(el('td', { class: dateClass }, formatDate(job.posted_at)));

  // Source
  tr.appendChild(el('td', { class: 'px-3 py-3' },
    el('span', { class: 'inline-flex rounded-md bg-zinc-100 px-2 py-0.5 text-xs font-medium text-zinc-700' }, 'France Travail'),
  ));

  // Entreprise · Poste
  const isUnknownCompany = job.company_name === 'Non communiqué';
  const companyLine = el('div', { class: 'flex items-center gap-2' },
    el('span', {
      class: isUnknownCompany ? 'font-medium italic text-zinc-400' : 'font-medium text-zinc-900',
    }, job.company_name),
    isUnknownCompany ? el('button', {
      type: 'button',
      class: 'text-xs text-blue-600 underline-offset-2 hover:underline',
      title: 'Renseigner le nom de l\'entreprise (e)',
      onClick: (e) => {
        e.stopPropagation();
        void renameCompanyPrompt(job);
      },
    }, '✎ Renseigner') : null,
  );
  const jobCell = el('td', { class: 'px-3 py-3' },
    el('div', { class: 'flex flex-col' },
      companyLine,
      el('span', { class: 'text-xs text-zinc-500' }, job.job_title),
    ),
  );
  if (job.source_url) {
    const link = el('a', {
      href: job.source_url, target: '_blank', rel: 'noopener noreferrer',
      class: 'mt-0.5 inline-flex items-center gap-1 text-xs text-blue-600 hover:underline',
      html: 'Voir l\'offre <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>',
    });
    link.addEventListener('click', (e) => e.stopPropagation());
    jobCell.firstChild.appendChild(link);
  }
  tr.appendChild(jobCell);

  // Dép.
  tr.appendChild(el('td', { class: 'whitespace-nowrap px-3 py-3 text-zinc-600' }, job.departement ?? '—'));

  // Métier
  tr.appendChild(el('td', { class: 'px-3 py-3 text-zinc-600' },
    el('div', { class: 'flex flex-col' },
      el('span', {}, job.rome_label ?? '—'),
      job.sector ? el('span', { class: 'text-xs text-zinc-400' }, job.sector) : null,
    ),
  ));

  // Statut
  const statusBadge = job.status === 'new'
    ? el('span', { class: 'inline-flex items-center gap-1 rounded-full bg-blue-50 px-2 py-0.5 text-xs font-medium text-blue-700 ring-1 ring-inset ring-blue-100' },
        el('span', { class: 'h-1.5 w-1.5 rounded-full bg-blue-500' }),
        'À prospecter',
      )
    : el('span', { class: 'inline-flex items-center gap-1 rounded-full bg-emerald-50 px-2 py-0.5 text-xs font-medium text-emerald-700 ring-1 ring-inset ring-emerald-100' },
        el('span', { class: 'h-1.5 w-1.5 rounded-full bg-emerald-500' }),
        'Prospecté',
      );
  tr.appendChild(el('td', { class: 'px-3 py-3' }, statusBadge));

  // Contact
  const contactParts = [job.contact_name, job.contact_email, job.contact_phone].filter(Boolean);
  tr.appendChild(el('td', { class: 'px-3 py-3 text-xs text-zinc-600' },
    contactParts.length ? el('span', { class: 'whitespace-pre-line' }, contactParts.join('\n')) : el('span', { class: 'text-zinc-300' }, '—'),
  ));

  // Actions
  const deleteBtn = el('button', {
    type: 'button',
    class: 'inline-flex items-center rounded-lg border border-red-200 bg-white px-3 py-1.5 text-xs font-medium text-red-700 shadow-sm transition hover:bg-red-50',
    title: 'Supprimer (d)',
    onClick: (e) => {
      e.stopPropagation();
      deleteWithUndo(job);
    },
  }, 'Supprimer');
  const actionBtn = el('button', {
    type: 'button',
    class: job.status === 'prospected'
      ? 'inline-flex items-center rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-xs font-medium text-zinc-700 shadow-sm transition hover:bg-zinc-50'
      : 'inline-flex items-center rounded-lg bg-zinc-900 px-3 py-1.5 text-xs font-medium text-white shadow-sm transition hover:bg-zinc-700',
    title: job.status === 'prospected' ? 'Éditer (p)' : 'Prospecter (p)',
    onClick: (e) => {
      e.stopPropagation();
      openProspectDialog(job);
    },
  }, job.status === 'prospected' ? 'Éditer' : 'Prospecter');
  tr.appendChild(el('td', { class: 'px-3 py-3 pr-6 text-right' },
    el('div', { class: 'inline-flex items-center gap-2' }, deleteBtn, actionBtn),
  ));

  return tr;
}

// Construction d'une ligne d'entreprise (vue groupée, onglet Prospectés)

function buildAccountGroupRow(account, jobs) {
  const expanded = expandedAccounts.has(account.id);
  const latestProspectedAt = jobs
    .map((j) => j.prospected_at)
    .filter(Boolean)
    .sort()
    .pop();
  const isUnknownCompany = account.company_name === 'Non communiqué';
  const stageCfg = STAGE_CONFIG[account.stage] ?? STAGE_CONFIG.nouveau;
  const contactsCount = account.contacts?.length ?? 0;

  // Indicateur "à traiter aujourd'hui"
  const today = new Date().toISOString().slice(0, 10);
  const isDue = account.next_action_at
    && account.next_action_at.slice(0, 10) <= today
    && account.stage !== 'gagne'
    && account.stage !== 'perdu';

  const tr = el('tr', {
    class: `border-b border-zinc-100 transition cursor-pointer ${
      isDue ? 'bg-amber-50/50 hover:bg-amber-50' : 'bg-white hover:bg-zinc-50'
    }`,
  });
  tr.addEventListener('click', (e) => {
    if (e.target.closest('button, a, input')) return;
    if (expanded) expandedAccounts.delete(account.id);
    else expandedAccounts.add(account.id);
    render();
  });

  // Toggle (cellule "Date")
  tr.appendChild(el('td', { class: 'px-6 py-4 text-zinc-400' },
    el('span', { class: 'inline-block w-3 text-sm' }, expanded ? '▼' : '▶'),
  ));

  // Source (vide)
  tr.appendChild(el('td', { class: 'px-3 py-4' }));

  // Entreprise + métadonnées (colspan 3 : Entreprise + Dép. + Métier)
  tr.appendChild(el('td', { class: 'px-3 py-4', colspan: 3 },
    el('div', { class: 'flex flex-col gap-1' },
      el('div', { class: 'flex flex-wrap items-baseline gap-x-3 gap-y-1' },
        el('span', {
          class: isUnknownCompany
            ? 'text-base font-semibold italic text-zinc-400'
            : 'text-base font-semibold text-zinc-900',
        }, account.company_name),
        el('span', { class: 'text-xs text-zinc-500' },
          `${jobs.length} poste${jobs.length > 1 ? 's' : ''}`,
        ),
        contactsCount > 0
          ? el('span', { class: 'text-xs text-zinc-500' }, `· ${contactsCount} contact${contactsCount > 1 ? 's' : ''}`)
          : null,
        latestProspectedAt
          ? el('span', { class: 'text-xs text-zinc-400' }, `· Dernier prospect : ${formatDate(latestProspectedAt)}`)
          : null,
        isUnknownCompany ? el('button', {
          type: 'button',
          class: 'text-xs text-blue-600 underline-offset-2 hover:underline',
          title: 'Renseigner le nom de l\'entreprise',
          onClick: (e) => {
            e.stopPropagation();
            void renameCompanyPrompt(jobs[0]);
          },
        }, '✎ Renseigner') : null,
      ),
      // Prochaine action (si définie)
      account.next_action || account.next_action_at
        ? el('div', { class: 'flex items-center gap-2 text-xs ' + (isDue ? 'text-amber-800' : 'text-zinc-500') },
            el('span', {}, isDue ? '⏰' : '📅'),
            el('span', {},
              (account.next_action ?? 'Action à venir') +
              (account.next_action_at ? ` · ${formatDate(account.next_action_at)}` : ''),
            ),
          )
        : null,
    ),
  ));

  // Étape (badge dynamique selon stage)
  tr.appendChild(el('td', { class: 'px-3 py-4' },
    el('span', {
      class: `inline-flex items-center gap-1.5 rounded-full px-2 py-0.5 text-xs font-medium ring-1 ring-inset ${stageCfg.cls}`,
    },
      el('span', { class: `h-1.5 w-1.5 rounded-full ${stageCfg.dot}` }),
      stageCfg.label,
    ),
  ));

  // Contact agrégé (account.contacts en priorité, fallback sur les jobs)
  const contactLabels = account.contacts && account.contacts.length > 0
    ? account.contacts.slice(0, 2).map((c) => c.name + (c.role ? ` (${c.role})` : ''))
    : (() => {
        const set = new Set();
        for (const j of jobs) {
          [j.contact_name, j.contact_email, j.contact_phone]
            .filter(Boolean).forEach((c) => set.add(c));
        }
        return Array.from(set).slice(0, 2);
      })();
  tr.appendChild(el('td', { class: 'px-3 py-4 text-xs text-zinc-600' },
    contactLabels.length
      ? el('span', { class: 'whitespace-pre-line' }, contactLabels.join('\n'))
      : el('span', { class: 'text-zinc-300' }, '—'),
  ));

  // Actions
  tr.appendChild(el('td', { class: 'px-3 py-4 pr-6 text-right text-xs text-zinc-400' },
    expanded ? 'Replier' : 'Voir détails',
  ));

  return tr;
}

// ============================================================================
// Bandeau "à traiter aujourd'hui" + panneau d'édition d'un compte
// ============================================================================

function getDueAccounts() {
  if (!store) return [];
  const today = new Date().toISOString().slice(0, 10);
  const prospectedAccountIds = new Set();
  for (const j of store.jobs) {
    if (j.status === 'prospected') prospectedAccountIds.add(j.account_id);
  }
  return store.accounts.filter((a) => {
    if (!a.next_action_at) return false;
    if (a.stage === 'gagne' || a.stage === 'perdu') return false;
    if (!prospectedAccountIds.has(a.id)) return false;
    return a.next_action_at.slice(0, 10) <= today;
  });
}

function renderTodayBanner() {
  const banner = document.getElementById('today-banner');
  banner.innerHTML = '';
  const due = getDueAccounts();
  if (due.length === 0) return;

  const preview = due.slice(0, 3).map((a) => a.company_name).join(', ')
    + (due.length > 3 ? ` +${due.length - 3}` : '');

  const box = el('div', {
    class: 'mb-6 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-amber-200 bg-amber-50 px-5 py-3 text-sm text-amber-900 shadow-sm',
  },
    el('div', { class: 'flex items-center gap-3' },
      el('span', { class: 'text-xl' }, '⏰'),
      el('div', {},
        el('p', { class: 'font-medium' },
          `${due.length} compte${due.length > 1 ? 's' : ''} à traiter aujourd'hui`,
        ),
        el('p', { class: 'text-xs text-amber-800/70' }, preview),
      ),
    ),
    el('button', {
      type: 'button',
      class: 'rounded-lg border border-amber-300 bg-white px-3 py-1.5 text-xs font-medium text-amber-900 transition hover:bg-amber-100',
      onClick: () => {
        // Bascule sur l'onglet Prospectés et déplie tous les comptes dus.
        currentFilters = { ...currentFilters, status: 'prospected' };
        writeFiltersToUrl(currentFilters);
        for (const a of due) expandedAccounts.add(a.id);
        render();
        // Scroll vers le tableau.
        document.getElementById('table-container')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      },
    }, 'Voir →'),
  );
  banner.appendChild(box);
}

// Construit le panneau d'édition affiché sous une ligne de compte dépliée.
// Contient : étapes du pipeline, prochaine action, notes, contacts, historique.
function buildAccountExpandedPanel(account, totalCols) {
  const wrap = el('tr', { class: 'border-b border-zinc-100 bg-zinc-50/40' });
  const cell = el('td', { class: 'px-6 py-5', colspan: totalCols });
  const panel = el('div', { class: 'flex flex-col gap-5' });

  // === 1. Étape du pipeline ===
  const stageRow = el('div', { class: 'flex flex-wrap items-center gap-2' });
  stageRow.appendChild(el('span', {
    class: 'mr-1 text-xs font-medium uppercase tracking-wider text-zinc-500',
  }, 'Étape'));
  for (const stage of STAGE_ORDER) {
    const cfg = STAGE_CONFIG[stage];
    const active = account.stage === stage;
    const chip = el('button', {
      type: 'button',
      class: active
        ? `inline-flex items-center gap-1.5 rounded-full px-3 py-1 text-xs font-medium ring-1 ring-inset ${cfg.cls}`
        : 'inline-flex items-center gap-1.5 rounded-full bg-white px-3 py-1 text-xs font-medium text-zinc-500 ring-1 ring-inset ring-zinc-200 transition hover:bg-zinc-50',
      onClick: async (e) => {
        e.stopPropagation();
        if (active) return;
        try {
          const newStore = await patchAccount(account.id, { stage });
          applyNewStore(newStore);
        } catch (err) {
          showToast(err.message ?? String(err), 'error');
        }
      },
    },
      el('span', { class: `h-1.5 w-1.5 rounded-full ${cfg.dot}` }),
      cfg.label,
    );
    stageRow.appendChild(chip);
  }
  panel.appendChild(stageRow);

  // === 2. Prochaine action ===
  const nextRow = el('div', { class: 'flex flex-wrap items-center gap-2' });
  nextRow.appendChild(el('span', {
    class: 'mr-1 text-xs font-medium uppercase tracking-wider text-zinc-500',
  }, 'Prochaine action'));
  const labelInput = el('input', {
    type: 'text',
    placeholder: 'ex: rappeler Marie, envoyer le pitch...',
    class: 'min-w-0 flex-1 rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-sm placeholder:text-zinc-400 focus:border-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-900/10',
  });
  labelInput.value = account.next_action ?? '';
  const dateInput = el('input', {
    type: 'date',
    class: 'rounded-lg border border-zinc-200 bg-white px-3 py-1.5 text-sm focus:border-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-900/10',
  });
  dateInput.value = account.next_action_at ? account.next_action_at.slice(0, 10) : '';

  let saving = false;
  const saveNextAction = async () => {
    if (saving) return;
    const newAction = labelInput.value.trim() || null;
    const newDate = dateInput.value
      ? new Date(dateInput.value + 'T09:00:00').toISOString()
      : null;
    if (newAction === (account.next_action ?? null) &&
        newDate === (account.next_action_at ?? null)) {
      return; // pas de changement
    }
    saving = true;
    try {
      const newStore = await patchAccount(account.id, {
        next_action: newAction,
        next_action_at: newDate,
      });
      applyNewStore(newStore);
    } catch (err) {
      showToast(err.message ?? String(err), 'error');
    } finally {
      saving = false;
    }
  };
  labelInput.addEventListener('blur', saveNextAction);
  dateInput.addEventListener('change', saveNextAction);
  nextRow.appendChild(labelInput);
  nextRow.appendChild(dateInput);
  if (account.next_action || account.next_action_at) {
    nextRow.appendChild(el('button', {
      type: 'button',
      class: 'text-xs text-zinc-500 underline-offset-2 hover:text-zinc-900 hover:underline',
      onClick: async (e) => {
        e.stopPropagation();
        try {
          const newStore = await patchAccount(account.id, {
            next_action: null, next_action_at: null,
          });
          applyNewStore(newStore);
        } catch (err) {
          showToast(err.message ?? String(err), 'error');
        }
      },
    }, 'Effacer'));
  }
  // Indicateur "en retard" si date <= today
  if (account.next_action_at) {
    const today = new Date().toISOString().slice(0, 10);
    if (account.next_action_at.slice(0, 10) <= today) {
      nextRow.appendChild(el('span', {
        class: 'inline-flex items-center gap-1 rounded-full bg-amber-50 px-2 py-0.5 text-xs font-medium text-amber-700 ring-1 ring-inset ring-amber-200',
      }, '⏰ À traiter'));
    }
  }
  panel.appendChild(nextRow);

  // === 3. Notes ===
  const notesWrap = el('div', { class: 'flex flex-col gap-1.5' });
  notesWrap.appendChild(el('span', {
    class: 'text-xs font-medium uppercase tracking-wider text-zinc-500',
  }, 'Notes'));
  const notesArea = el('textarea', {
    rows: 2,
    placeholder: 'Contexte, blocages, prochaines étapes...',
    class: 'rounded-lg border border-zinc-200 bg-white px-3 py-2 text-sm placeholder:text-zinc-400 focus:border-zinc-400 focus:outline-none focus:ring-2 focus:ring-zinc-900/10',
  });
  notesArea.value = account.notes ?? '';
  let savingNotes = false;
  notesArea.addEventListener('blur', async () => {
    if (savingNotes) return;
    const newNotes = notesArea.value.trim() || null;
    if (newNotes === (account.notes ?? null)) return;
    savingNotes = true;
    try {
      const newStore = await patchAccount(account.id, { notes: newNotes });
      applyNewStore(newStore);
    } catch (err) {
      showToast(err.message ?? String(err), 'error');
    } finally {
      savingNotes = false;
    }
  });
  notesWrap.appendChild(notesArea);
  panel.appendChild(notesWrap);

  // === 4. Contacts ===
  const contactsWrap = el('div', { class: 'flex flex-col gap-2' });
  const contactsHeader = el('div', { class: 'flex items-center justify-between' },
    el('span', { class: 'text-xs font-medium uppercase tracking-wider text-zinc-500' },
      `Contacts${account.contacts.length > 0 ? ` (${account.contacts.length})` : ''}`,
    ),
    el('button', {
      type: 'button',
      class: 'inline-flex items-center gap-1 rounded-lg border border-zinc-300 bg-white px-2.5 py-1 text-xs font-medium text-zinc-700 shadow-sm transition hover:bg-zinc-50',
      onClick: (e) => {
        e.stopPropagation();
        editingContact = { accountId: account.id, contactId: null };
        render();
      },
    }, '+ Ajouter contact'),
  );
  contactsWrap.appendChild(contactsHeader);

  const contactsGrid = el('div', { class: 'grid gap-2 sm:grid-cols-2' });
  // Formulaire d'ajout en première position s'il est ouvert.
  if (editingContact && editingContact.accountId === account.id && editingContact.contactId === null) {
    contactsGrid.appendChild(buildContactForm(account, null));
  }
  for (const c of account.contacts) {
    if (editingContact && editingContact.accountId === account.id && editingContact.contactId === c.id) {
      contactsGrid.appendChild(buildContactForm(account, c));
    } else {
      contactsGrid.appendChild(buildContactCard(account, c));
    }
  }
  if (account.contacts.length === 0 && !(editingContact && editingContact.accountId === account.id && editingContact.contactId === null)) {
    contactsGrid.appendChild(el('p', { class: 'text-sm text-zinc-400 italic' }, 'Aucun contact pour le moment.'));
  }
  contactsWrap.appendChild(contactsGrid);
  panel.appendChild(contactsWrap);

  // === 5. Activity log ===
  if (account.activity && account.activity.length > 0) {
    const log = el('details', { class: 'group' });
    log.appendChild(el('summary', {
      class: 'cursor-pointer text-xs font-medium uppercase tracking-wider text-zinc-500 hover:text-zinc-900 list-none',
    }, `Historique (${account.activity.length}) ▾`));
    const ul = el('ul', { class: 'mt-2 flex flex-col gap-1 text-xs text-zinc-600 pl-2 border-l-2 border-zinc-200' });
    // Ordre antéchronologique
    const sorted = account.activity.slice().sort((a, b) => b.at.localeCompare(a.at));
    for (const entry of sorted.slice(0, 30)) {
      const when = new Date(entry.at).toLocaleString('fr-FR', {
        day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit',
      });
      ul.appendChild(el('li', { class: 'pl-3' },
        el('span', { class: 'text-zinc-400' }, when + ' · '),
        el('span', {}, entry.message),
      ));
    }
    log.appendChild(ul);
    panel.appendChild(log);
  }

  cell.appendChild(panel);
  wrap.appendChild(cell);
  return wrap;
}

function buildContactCard(account, contact) {

    el('span', { class: 'font-medium text-zinc-900' }, contact.name),
    contact.role ? el('span', { class: 'text-xs text-zinc-500' }, '· ' + contact.role) : null,
  ));
  if (contact.email) {
    info.appendChild(el('a', {
      href: `mailto:${contact.email}`,
      class: 'text-xs text-blue-600 hover:underline',
      onClick: (e) => e.stopPropagation(),
    }, contact.email));
  }
  if (contact.phone) {
    info.appendChild(el('a', {
      href: `tel:${contact.phone.replace(/\s+/g, '')}`,
      class: 'text-xs text-zinc-600 hover:underline',
      onClick: (e) => e.stopPropagation(),
    }, contact.phone));
  }
  if (contact.notes) {
    info.appendChild(el('p', { class: 'text-xs text-zinc-500 italic' }, contact.notes));

    title: 'Éditer',
    onClick: (e) => {
      e.stopPropagation();
      editingContact = { accountId: account.id, contactId: contact.id };

    onClick: async (e) => {

function renderTable() {
  const container = document.getElementById('table-container');
  container.innerHTML = '';

  // On exclut les jobs en suspens de suppression (toast Annuler en cours).
  const allFiltered = filterJobs(store.jobs, currentFilters)
    .filter((j) => !pendingDeletions.has(j.id));

  if (allFiltered.length === 0) {
    visibleJobsCache = [];
    container.appendChild(el('div', { class: 'flex flex-col items-center justify-center gap-3 px-6 py-16 text-center' },
      el('div', { class: 'flex h-16 w-16 items-center justify-center rounded-full bg-zinc-100 text-zinc-400', html: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>' }),
      el('p', { class: 'text-sm font-medium text-zinc-700' }, 'Aucune offre à afficher'),
      el('p', { class: 'max-w-sm text-sm text-zinc-500' }, 'Lance une ingestion ou ajuste les filtres pour voir apparaître des offres ici.'),
    ));
    return;
  }

  const wrapper = el('div', { class: 'overflow-x-auto' });
  const table = el('table', { class: 'min-w-full text-sm' });
  const tbody = el('tbody', {});

  const isProspectedView = currentFilters.status === 'prospected';
  const showCheckbox = !isProspectedView; // multi-select sur À prospecter et Toutes

  // === En-tête ===
  const headerCells = [];
  if (showCheckbox) {
    const checkAll = el('input', {
      type: 'checkbox',
      class: 'h-4 w-4 cursor-pointer rounded border-zinc-300',
      'aria-label': 'Tout sélectionner',
    });
    const allSelected = allFiltered.length > 0 && allFiltered.every((j) => selectedJobIds.has(j.id));
    checkAll.checked = allSelected;
    checkAll.indeterminate = !allSelected && allFiltered.some((j) => selectedJobIds.has(j.id));
    checkAll.addEventListener('click', (e) => {
      e.stopPropagation();
      if (checkAll.checked) {
        for (const j of allFiltered) selectedJobIds.add(j.id);
      } else {
        for (const j of allFiltered) selectedJobIds.delete(j.id);
      }
      render();
    });
    headerCells.push(el('th', { class: 'px-3 py-3 first:pl-6' }, checkAll));
  }
  for (const h of ['Date', 'Source', 'Entreprise · Poste', 'Dép.', 'Métier', 'Statut', 'Contact', '']) {
    headerCells.push(el('th', { class: 'px-3 py-3 font-medium first:pl-6 last:pr-6' }, h));
  }
  table.appendChild(el('thead', {},
    el('tr', { class: 'border-b border-zinc-100 bg-zinc-50/50 text-left text-xs uppercase tracking-wider text-zinc-500' }, ...headerCells),
  ));

  // === Corps ===
  if (isProspectedView) {
    // Groupement par account_id
    const groups = new Map();
    for (const job of allFiltered) {
      const k = job.account_id;
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(job);
    }
    // Tri : dernier prospected_at d'abord (groupes les plus récents en haut)
    const sortedAccountIds = Array.from(groups.keys()).sort((a, b) => {
      const lastA = groups.get(a).map((j) => j.prospected_at).filter(Boolean).sort().pop() ?? '';
      const lastB = groups.get(b).map((j) => j.prospected_at).filter(Boolean).sort().pop() ?? '';
      return lastB.localeCompare(lastA);
    });
    // Cache pour la nav clavier : on inclut tous les jobs visibles dans l'ordre d'affichage
    visibleJobsCache = [];
    for (const accountId of sortedAccountIds) {
      const jobs = groups.get(accountId);
      // Account "fantôme" si jamais l'account n'est pas dans store.accounts (rare)
      const account = store.accounts.find((a) => a.id === accountId)
        ?? { id: accountId, company_name: jobs[0].company_name };
      tbody.appendChild(buildAccountGroupRow(account, jobs));
      if (expandedAccounts.has(accountId)) {
        // Panneau d'édition (étape, prochaine action, contacts, historique)
        // — uniquement pour les comptes "vrais" présents dans store.accounts.
        if (store.accounts.find((a) => a.id === accountId)) {
          tbody.appendChild(buildAccountExpandedPanel(account, 8));
        }
        for (const job of jobs) {
          tbody.appendChild(buildJobRow(job, { showCheckbox: false, indented: true }));
          visibleJobsCache.push(job);
        }
      }
    }
  } else {
    visibleJobsCache = allFiltered.slice();
    for (const job of allFiltered) {
      tbody.appendChild(buildJobRow(job, { showCheckbox: true, indented: false }));
    }
  }

  table.appendChild(tbody);
  wrapper.appendChild(table);
  container.appendChild(wrapper);
}

function renderActions() {

// Suppression en lot avec annulation 5s (un seul toast pour tout le lot).
function bulkDeleteWithUndo(jobs) {
  if (jobs.length === 0) return;
  const ids = jobs.map((j) => j.id);
  for (const j of jobs) {
    if (!pendingDeletions.has(j.id)) {
      pendingDeletions.set(j.id, { job: j, handle: null });
    }
  }
  selectedJobIds.clear();

  const handle = showUndoToast(
    `${jobs.length} offre${jobs.length > 1 ? 's' : ''} supprimée${jobs.length > 1 ? 's' : ''}`,
    async () => {
      for (const id of ids) pendingDeletions.delete(id);
      // On enchaîne les DELETEs en série pour éviter les écritures KV concurrentes.
      let lastStore = null;
      let failures = [];
      for (const id of ids) {
        try {
          lastStore = await deleteLead(id);
        } catch (err) {
          failures.push({ id, err });
        }
      }
      if (lastStore) applyNewStore(lastStore);
      if (failures.length) {
        showToast(`Échec sur ${failures.length} suppression${failures.length > 1 ? 's' : ''} : ${failures[0].err.message ?? failures[0].err}`, 'error');
      }
    },
    () => {
      for (const id of ids) pendingDeletions.delete(id);
      render();
    },
  );
  // On stocke la même handle pour chaque pending afin que le focus ne s'y bloque pas
  for (const id of ids) {
    const p = pendingDeletions.get(id);
    if (p) p.handle = handle;
  }
  if (focusedJobId && ids.includes(focusedJobId)) focusedJobId = null;
  render();
}

async function bulkMarkProspected(jobs) {
  const ids = jobs.filter((j) => j.status === 'new').map((j) => j.id);
  if (ids.length === 0) {
    showToast('Aucune offre "À prospecter" dans la sélection.', 'info');
    return;
  }
  try {
    const newStore = await markAllProspectedIds(ids);
    selectedJobIds.clear();
    showToast(`${ids.length} offre(s) basculée(s) en prospected.`, 'info');
    applyNewStore(newStore);
  } catch (err) {
    showToast(err.message ?? String(err), 'error');
  }
}

// ============================================================================
// Raccourcis clavier
// ============================================================================
//
// j / ↓     : focus la ligne suivante
// k / ↑     : focus la ligne précédente
// p         : prospecter / éditer la ligne focus
// d         : supprimer la ligne focus (avec annulation 5s)
// e         : renseigner le nom (si entreprise = "Non communiqué")
// x         : (dé)cocher la sélection multi sur la ligne focus
// Échap     : retire le focus + désélectionne tout
// ?         : aide

function showShortcutsHelp() {
  const lines = [
    'Raccourcis clavier :',
    '',
    '  j / ↓     ligne suivante',
    '  k / ↑     ligne précédente',
    '  p         prospecter / éditer',
    '  d         supprimer (annulable 5s)',
    '  e         renseigner le nom (si Non communiqué)',
    '  x         (dé)cocher la ligne pour sélection multi',
    '  Échap     retire le focus + désélectionne',
    '  ?         affiche cette aide',
  ];
  window.alert(lines.join('\n'));
}

function moveFocus(delta) {
  if (visibleJobsCache.length === 0) return;
  const idx = focusedJobId
    ? visibleJobsCache.findIndex((j) => j.id === focusedJobId)
    : -1;
  let next;
  if (idx === -1) {
    next = delta > 0 ? visibleJobsCache[0] : visibleJobsCache[visibleJobsCache.length - 1];
  } else {
    const i = Math.max(0, Math.min(visibleJobsCache.length - 1, idx + delta));
    next = visibleJobsCache[i];
  }
  if (!next) return;
  focusedJobId = next.id;
  render();
  // Scroll la ligne dans la vue
  const tr = document.querySelector(`tr[data-job-id="${CSS.escape(next.id)}"]`);
  tr?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

function focusedJob() {
  if (!focusedJobId) return null;
  return visibleJobsCache.find((j) => j.id === focusedJobId) ?? null;
}

document.addEventListener('keydown', (e) => {
  // Skip si modifier (Ctrl/Cmd/Alt) ou champ texte focus.
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
  if (document.getElementById('prospect-dialog')?.open) return;

  const k = e.key;
  if (k === 'j' || k === 'ArrowDown') {
    e.preventDefault();
    moveFocus(1);
    return;
  }
  if (k === 'k' || k === 'ArrowUp') {
    e.preventDefault();
    moveFocus(-1);
    return;
  }
  if (k === 'Escape') {
    if (focusedJobId || selectedJobIds.size > 0) {
      focusedJobId = null;
      selectedJobIds.clear();
      lastClickedJobId = null;
      render();
    }
    return;
  }
  if (k === '?') {
    e.preventDefault();
    showShortcutsHelp();
    return;
  }

  const job = focusedJob();
  if (!job) return;

  if (k === 'p') {
    e.preventDefault();
    openProspectDialog(job);
  } else if (k === 'd') {
    e.preventDefault();
    deleteWithUndo(job);
  } else if (k === 'e') {
    if (job.company_name === 'Non communiqué') {
      e.preventDefault();
      void renameCompanyPrompt(job);
    }
  } else if (k === 'x') {
    e.preventDefault();
    if (selectedJobIds.has(job.id)) selectedJobIds.delete(job.id);
    else selectedJobIds.add(job.id);
    lastClickedJobId = job.id;
    render();
  }
});

// ============================================================================
// Bootstrap
// ============================================================================

currentFilters = readFiltersFromUrl();
reload();
</script>
</body>

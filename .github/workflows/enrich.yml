name: Enrichir leads (Cloudflare KV)

on:
  # Cron journalier : tous les jours à 6h UTC (~7h/8h Paris selon l'heure d'été).
  schedule:
    - cron: '0 6 * * *'
  # Déclenchable manuellement depuis l'UI ou l'API GitHub (bouton "Ingérer maintenant").
  workflow_dispatch:

# Une seule exécution à la fois.
concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enrichir leads (vers Cloudflare KV via Worker)
        env:
          FRANCE_TRAVAIL_WORKER_URL: ${{ secrets.FRANCE_TRAVAIL_WORKER_URL }}
          FRANCE_TRAVAIL_WORKER_KEY: ${{ secrets.FRANCE_TRAVAIL_WORKER_KEY }}
        run: npm run enrich
